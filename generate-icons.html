<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #1a1a1a; color: white; }
        .icon-preview { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .icon-item { text-align: center; }
        canvas { display: block; margin-bottom: 5px; border-radius: 20%; }
        a { color: #007AFF; display: block; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>Right-click each icon and "Save Image As" to the icons folder</p>
    <div class="icon-preview" id="icons"></div>
    
    <script>
        const sizes = [16, 32, 72, 96, 128, 144, 152, 167, 180, 192, 384, 512];
        const container = document.getElementById('icons');
        
        sizes.forEach(size => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#007AFF');
            gradient.addColorStop(1, '#AF52DE');
            
            // Rounded rectangle
            const radius = size * 0.22;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Emoji
            ctx.font = `${size * 0.55}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💪', size/2, size/2 + size*0.05);
            
            const div = document.createElement('div');
            div.className = 'icon-item';
            div.appendChild(canvas);
            
            const label = document.createElement('span');
            label.textContent = `${size}x${size}`;
            div.appendChild(label);
            
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `icon-${size}.png`;
            link.textContent = 'Download';
            link.onclick = () => {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = `icon-${size}.png`;
                a.click();
            };
            div.appendChild(link);
            
            container.appendChild(div);
        });
        
        // Auto download all
        document.body.insertAdjacentHTML('beforeend', '<br><button id="downloadAll" style="padding:15px 30px; font-size:16px; background:#007AFF; color:white; border:none; border-radius:10px; cursor:pointer; margin-top:20px;">Download All Icons</button>');
        
        document.getElementById('downloadAll').onclick = () => {
            sizes.forEach((size, i) => {
                setTimeout(() => {
                    const canvas = document.querySelectorAll('canvas')[i];
                    const a = document.createElement('a');
                    a.href = canvas.toDataURL('image/png');
                    a.download = `icon-${size}.png`;
                    a.click();
                }, i * 200);
            });
        };
    </script>
</body>
</html>
